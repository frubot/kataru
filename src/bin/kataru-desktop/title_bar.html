<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0f1117;
    --text: #f4f5fb;
    --muted: #70778c;
    --border: #30364d;
    --hover: #252a3f;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 13px "Segoe UI Variable Text", "Segoe UI", "Yu Gothic UI", sans-serif;
    user-select: none;
    cursor: default;
  }
  .bar {
    display: flex;
    align-items: stretch;
    height: 100%;
    box-sizing: border-box;
    border-bottom: 1px solid var(--border);
  }
  .menus {
    display: flex;
    align-items: center;
    gap: 2px;
    padding-left: 6px;
  }
  .menus button {
    height: 30px;
    padding: 0 12px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: inherit;
  }
  .menus .sidebar-toggle {
    display: grid;
    place-items: center;
    width: 32px;
    padding: 0;
    margin-right: 8px;
  }
  .menus button:hover,
  .menus button.open { background: var(--hover); }
  .drag-area { flex: 1; }
  .controls { display: flex; }
  .controls button {
    width: 46px;
    border: 0;
    padding: 0;
    background: transparent;
    color: inherit;
    font: 10px "Segoe Fluent Icons", "Segoe MDL2 Assets";
  }
  .controls button:hover { background: var(--hover); }
  .controls .close:hover { background: #c42b1c; color: #fff; }
  body.inactive .bar { color: var(--muted); }
  .resize { position: fixed; top: 0; height: 4px; }
  .resize.n { left: 8px; right: 8px; cursor: n-resize; }
  .resize.nw { left: 0; width: 8px; cursor: nw-resize; }
  .resize.ne { right: 0; width: 8px; cursor: ne-resize; }
  body.maximized .resize { display: none; }
</style>
</head>
<body>
<div class="bar" id="bar">
  <div class="menus">
    <button id="sidebar-toggle" class="sidebar-toggle" title="サイドバー" aria-label="サイドバー">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
    </button>
    <button class="menu" data-menu="edit" aria-haspopup="menu">編集</button>
    <button class="menu" data-menu="view" aria-haspopup="menu">表示</button>
    <button class="menu" data-menu="help" aria-haspopup="menu">ヘルプ</button>
  </div>
  <div class="drag-area"></div>
  <div class="controls">
    <button id="minimize" title="最小化" aria-label="最小化">&#xE921;</button>
    <button id="maximize" title="最大化" aria-label="最大化">&#xE922;</button>
    <button id="close" class="close" title="閉じる" aria-label="閉じる">&#xE8BB;</button>
  </div>
</div>
<div class="resize n" data-direction="n"></div>
<div class="resize nw" data-direction="nw"></div>
<div class="resize ne" data-direction="ne"></div>
<script>
  const post = (message) => window.ipc.postMessage(message);
  const maximizeButton = document.getElementById('maximize');
  const menuButtons = [...document.querySelectorAll('.menu')];
  let openMenu = null;

  const setOpenMenu = (menu) => {
    openMenu = menu;
    for (const button of menuButtons) {
      const open = button.dataset.menu === menu;
      button.classList.toggle('open', open);
      button.setAttribute('aria-expanded', String(open));
    }
  };
  const showMenu = (button) => {
    setOpenMenu(button.dataset.menu);
    post(`menu:${button.dataset.menu}:${button.getBoundingClientRect().left}`);
  };
  const closeMenu = () => {
    if (openMenu === null) return;
    setOpenMenu(null);
    post('menu-close');
  };

  for (const button of menuButtons) {
    button.addEventListener('mousedown', (event) => {
      if (event.button !== 0) return;
      if (openMenu === button.dataset.menu) closeMenu();
      else showMenu(button);
    });
    // メニューを開いている間は、ほかの見出しに乗せるだけで切り替える。
    button.addEventListener('mouseenter', () => {
      if (openMenu !== null && openMenu !== button.dataset.menu) showMenu(button);
    });
  }
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeMenu();
  });

  document.getElementById('bar').addEventListener('mousedown', (event) => {
    if (event.button !== 0 || event.target.closest('button')) return;
    closeMenu();
    // ドラッグ開始後はOSが移動処理を持つため、dblclickは届かない。2回目の押下で判定する。
    post(event.detail === 2 ? 'toggle-maximize' : 'drag');
  });
  for (const edge of document.querySelectorAll('.resize')) {
    edge.addEventListener('mousedown', (event) => {
      if (event.button === 0) post(`resize-${edge.dataset.direction}`);
    });
  }
  document.getElementById('sidebar-toggle').addEventListener('click', () => {
    closeMenu();
    post('toggle-sidebar');
  });
  document.getElementById('minimize').addEventListener('click', () => post('minimize'));
  maximizeButton.addEventListener('click', () => post('toggle-maximize'));
  document.getElementById('close').addEventListener('click', () => post('close'));
  document.addEventListener('contextmenu', (event) => event.preventDefault());
  window.addEventListener('focus', () => post('activation'));
  window.addEventListener('blur', () => post('activation'));

  window.titleBar = {
    setTheme(theme) {
      for (const [name, value] of Object.entries(theme)) {
        document.documentElement.style.setProperty(`--${name}`, value);
      }
    },
    setMaximized(maximized) {
      document.body.classList.toggle('maximized', maximized);
      maximizeButton.textContent = maximized ? '' : '';
      const label = maximized ? '元に戻す' : '最大化';
      maximizeButton.title = label;
      maximizeButton.setAttribute('aria-label', label);
    },
    setActive(active) {
      document.body.classList.toggle('inactive', !active);
    },
    setOpenMenu,
  };
  post('ready');
</script>
</body>
</html>
