name: Build

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.18.0

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run check:release-version -- "${{ github.ref_name }}"

      - name: Install npm dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # RustEmbed が out/ を必要とするため、Rust検査より先に実行します
      - name: Build frontend
        run: npm run build

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-check-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-check-cargo-

      - name: Rust tests
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: Build ${{ matrix.artifact }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: kataru-windows-x64
            archive: kataru-windows-x64.zip
            updater_binary: kataru-windows-x64.exe

          - os: ubuntu-latest
            artifact: kataru-linux-x64
            archive: kataru-linux-x64.tar.gz
            updater_binary: kataru-linux-x64

          # 現在の macos-latest はArm64です
          - os: macos-latest
            artifact: kataru-macos-arm64
            archive: kataru-macos-arm64.tar.gz
            updater_binary: kataru-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.18.0

      - name: Install npm dependencies
        run: npm ci

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-release-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-cargo-

      - name: Build frontend
        run: npm run build

      - name: Clippy desktop app
        if: runner.os == 'Windows'
        run: cargo clippy --bins --locked --features desktop -- -D warnings

      - name: Build release binary
        if: runner.os != 'Windows'
        run: cargo build --release --locked

      # Windowsではデスクトップ版（kataru-desktop.exe）も同時にビルドします
      - name: Build release binaries with desktop app
        if: runner.os == 'Windows'
        run: cargo build --release --locked --features desktop

      - name: Smoke test
        run: npm run smoke:binary

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item `
            -LiteralPath target/release/kataru.exe `
            -Destination "${{ matrix.updater_binary }}"
          Copy-Item `
            -LiteralPath target/release/kataru-desktop.exe `
            -Destination kataru-desktop-windows-x64.exe
          Compress-Archive `
            -LiteralPath target/release/kataru.exe, target/release/kataru-desktop.exe `
            -DestinationPath "${{ matrix.archive }}"

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp target/release/kataru "${{ matrix.updater_binary }}"
          tar -czf "${{ matrix.archive }}" -C target/release kataru

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.updater_binary }}
            kataru-desktop-windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: kataru-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" dist/* \
            --verify-tag \
            --generate-notes
