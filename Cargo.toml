[package]
name = "kataru"
version = "0.16.0"
edition = "2024"
license = "MIT"
description = "Standalone local-first roleplay chat application"
default-run = "kataru"

[dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.23"
directories = "6"
dotenvy = "0.15"
futures-util = "0.3"
getrandom = "0.4"
keyring = "4.1"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
rpassword = "7.5"
rusqlite = { version = "0.42", features = ["backup", "bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tao = { version = "0.37", optional = true }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.25.0", features = ["v4"] }
webbrowser = "1"
wry = { version = "0.57", optional = true }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
incremental = false

[profile.test]
incremental = false

[build-dependencies]
embed-resource = "3.0.11"

[features]
# デスクトップ版（kataru-desktop）のビルドに必要な依存を有効にする。
desktop = ["dep:wry", "dep:tao", "dep:windows-sys"]

[[bin]]
name = "kataru-desktop"
path = "src/bin/kataru-desktop/main.rs"
required-features = ["desktop"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"], optional = true }
